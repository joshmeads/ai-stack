id: no-comments
language: Rust
severity: error
message: "Remove this comment; express meaning in code (names, types, structure) and rationale in the PR. Keep license headers, a single-line WARNING: or SAFETY: comment, doc comments on pub items, //! module docs, and clap doc text that generates --help."
metadata:
  allow_license_header: true
utils:
  pub-item:
    has:
      kind: visibility_modifier
      regex: '^pub$'
  doc:
    regex: '^(///|/\*\*)'
  comment:
    any:
      - kind: line_comment
      - kind: block_comment
  decoration:
    any:
      - kind: line_comment
      - kind: block_comment
      - kind: attribute_item
  clap-derive:
    kind: attribute_item
    regex: 'derive\([^)]*\b(Parser|Subcommand|Args|ValueEnum)\b'
  clap-type:
    any:
      - kind: struct_item
      - kind: enum_item
    follows:
      stopBy:
        not:
          matches: decoration
      matches: clap-derive
rule:
  any:
    - kind: line_comment
    - kind: block_comment
  not:
    any:
      - regex: '^//\s*(WARNING|SAFETY):\s*\S[^\n]*\n?$'
      - regex: '(SPDX-License-Identifier:|Copyright\s)'
      - regex: '^(//!|/\*!)'
      - all:
          - matches: doc
          - precedes:
              stopBy:
                not:
                  matches: decoration
              matches: pub-item
      - all:
          - matches: doc
          - precedes:
              stopBy:
                not:
                  matches: decoration
              not:
                matches: decoration
          - inside:
              any:
                - kind: enum_variant_list
                - kind: declaration_list
              inside:
                any:
                  - kind: enum_item
                  - kind: trait_item
                matches: pub-item
      - all:
          - matches: doc
          - precedes:
              stopBy:
                not:
                  matches: decoration
              any:
                - matches: clap-derive
                - matches: clap-type
      - all:
          - matches: doc
          - inside:
              stopBy: end
              matches: clap-type
---
id: no-comments
language: Python
severity: error
message: "Remove this comment; express meaning in code (names, types, structure) and rationale in the PR. Keep tool directives, license headers, PEP 723 script metadata and a single-line WARNING: or SAFETY: comment."
metadata:
  allow_license_header: true
  allow_in: '(?m)^# /// [a-zA-Z0-9-]+\r?\n(?:#(?: [^\r\n]*)?\r?\n)*?# ///\r?$'
rule:
  kind: comment
  not:
    any:
      - regex: '^#!'
      - regex: '^#.*coding[:=]'
      - regex: '^#\s*(type:|noqa|pragma|pylint:|mypy:|pyright:|fmt:|isort:|ruff:|nosec|pyre-)'
      - regex: '(SPDX-License-Identifier:|Copyright\s)'
      - regex: '^#\s*(WARNING|SAFETY):\s*\S'
---
id: no-comments
language: Go
severity: error
message: "Remove this comment; express meaning in code (names, types, structure) and rationale in the PR. Keep directives, license headers, a cgo preamble, Example output comments, a single-line WARNING: or SAFETY: comment, and doc comments on exported identifiers."
utils:
  exported-name:
    has:
      field: name
      regex: '^\p{Lu}'
  exported-declaration:
    any:
      - kind: package_clause
      - kind: function_declaration
        matches: exported-name
      - kind: method_declaration
        matches: exported-name
      - kind: field_declaration
        matches: exported-name
      - kind: type_declaration
        has:
          any:
            - kind: type_spec
            - kind: type_alias
          matches: exported-name
      - kind: const_declaration
        has:
          kind: const_spec
          matches: exported-name
      - kind: var_declaration
        has:
          kind: var_spec
          matches: exported-name
      - kind: const_spec
        matches: exported-name
      - kind: var_spec
        matches: exported-name
      - kind: type_spec
        matches: exported-name
      - kind: type_alias
        matches: exported-name
      - kind: method_elem
        matches: exported-name
  in-example:
    inside:
      stopBy: end
      kind: function_declaration
      has:
        field: name
        regex: '^Example'
  example-output:
    kind: comment
    regex: '^//\s*(Unordered output|Output):'
rule:
  kind: comment
  not:
    any:
      - all:
          - matches: in-example
          - any:
              - matches: example-output
              - follows:
                  stopBy:
                    not:
                      kind: comment
                  matches: example-output
      - precedes:
          stopBy:
            not:
              kind: comment
          kind: import_declaration
          regex: '^import\s+"C"\s*$'
      - regex: '^//(go:|line |export |extern |nolint)'
      - regex: '^//\s*\+build'
      - regex: '^//\s*Code generated .* DO NOT EDIT\.$'
      - regex: '(SPDX-License-Identifier:|Copyright\s)'
      - regex: '^//\s*(WARNING|SAFETY):\s*\S[^\n]*$'
      - precedes:
          stopBy:
            not:
              kind: comment
          matches: exported-declaration
