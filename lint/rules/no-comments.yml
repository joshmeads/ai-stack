id: no-comments
language: [TypeScript, Tsx]
severity: error
message: "Remove this comment; express meaning in code (names, types, structure) and rationale in the PR. Keep tool directives, license headers, a single-line WARNING: or SAFETY: comment for a dangerous footgun, and doc comments on exported API."
metadata:
  allow_license_header: true
utils:
  directive:
    any:
      - regex: '^(//|/\*)[!*]?\s*(eslint|oxlint|biome-ignore|@ts-|prettier-ignore|oxfmt-ignore|istanbul\s|c8\s|v8\s|@vite-ignore|webpack[A-Z]|@jsx|@__PURE__|#__PURE__|@__NO_SIDE_EFFECTS__|nosemgrep|#\s*source(Mapping)?URL=)'
      - regex: '^///\s*<(reference|amd-module|amd-dependency)\s'
      - regex: '^/\*\s*(globals?|exported)\s'
      - regex: '@(vitest|jest)-environment\s'
      - regex: '(SPDX-License-Identifier:|@license\b|Copyright\s)'
  footgun:
    regex: '^//\s*(WARNING|SAFETY):\s*\S[^\n]*$'
  doc:
    regex: '^/\*\*'
  doc-on-export:
    all:
      - matches: doc
      - precedes:
          stopBy:
            not:
              kind: comment
          kind: export_statement
  doc-on-exported-member:
    all:
      - matches: doc
      - precedes:
          stopBy:
            not:
              kind: comment
          not:
            kind: comment
      - inside:
          stopBy:
            kind: statement_block
          kind: export_statement
rule:
  kind: comment
  not:
    any:
      - matches: directive
      - matches: footgun
      - matches: doc-on-export
      - matches: doc-on-exported-member
---
