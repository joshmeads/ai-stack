[package]
name = "ai-stack"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ast-grep-config = "0.51.3"
ast-grep-core = "0.51.3"
ast-grep-language = { version = "0.51.3", default-features = false, features = ["tree-sitter-typescript", "tree-sitter-javascript", "tree-sitter-rust", "tree-sitter-python", "tree-sitter-go"] }
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
globset = "0.4.18"
libc = "0.2.190"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
similar = "3.2.0"
signal-hook = "0.3.18"
toml = "1.1.8"
tempfile = "3.27.0"
time = "0.3.55"
toml_edit = "0.25.17"
