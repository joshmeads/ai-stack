# pstack config. Edit, then run `ai-stack install`.

[stack]
# Checkout of joshmeads/ai-stack. ai-stack adds it to each harness as the
# local `jm` plugin marketplace, installs its plugins (pstack, t3stack and
# pocock), and links the skills of
# the global groups in its stack.toml into each harness's user skill folder.
path = "~/Documents/Projects/@joshmeads/ai-stack"
remote = "origin"
branch = "main"
# Older checkout roots. Skill and agent links and settings hooks that point
# into the stack or these roots are ai-stack's: a skill link a global group
# wants is kept or repointed, and the rest are removed.
legacy_paths = ["~/.local/share/open-pstack"]

[harness.claude]
home = "~/.claude"
enabled = true

[harness.codex]
home = "~/.codex"
enabled = true

# Models used by [leads] and [review], checked by `ai-stack models`.
# Each names a `family` (sol, astra, terra, luna, opus, haiku, sonnet or fable),
# which follows the stack's model registry, or an exact `id` it registers,
# which stays pinned. Optional `efforts` limits a model to those efforts; every
# route that uses it must then name one. Optional `context` is the model's
# usable context in tokens; the routing block states it. ai-stack does not
# configure compaction.

[models.sol]
family = "sol"

[models.astra]
family = "astra"

[models.terra]
family = "terra"

[models.opus]
family = "opus"

[models.haiku]
family = "haiku"
# The owner sets Haiku's compaction in Claude Code at 100k tokens because
# Anthropic bills the whole request at 5x once the prompt exceeds 100k tokens.
context = 100000

# The lead in each harness, as "alias@effort". This only describes the lead in
# the routing block; install does not change either CLI's default model.
[leads]
claude = "opus@high"
codex = "sol@high"

# The review model in each harness, as "alias@effort". The routing block names
# it, and the art-iteration skill's critic uses it.
[review]
claude = "opus@xhigh"
codex = "astra@xhigh"

# pstack model sheets, one per harness, written to <home>/pstack-models.md.
# Each lane is a provider-qualified descriptor `<provider>:<family>@<effort>`,
# written to the sheet as the family's current model, or an exact
# `<provider>:<model>@<effort>` (see the pstack provider-dispatch reference),
# or inherit-parent / auto.
# Panel rows accept arrays. Why and Reflect need the parent's MCP servers, so
# they must inherit the parent. All 15 rows are required in each table. A
# read-only provider on "arena runners" returns its candidate to the parent.

[sheet.claude]
"feature, refactoring" = "claude:opus@medium"
"bug-fix" = "claude:opus@medium"
"perf-issue" = "claude:opus@medium"
"hillclimb" = "claude:opus@medium"
"judgment and prose" = "claude:opus@xhigh"
"hardest tasks" = "claude:opus@high"
"how explorer" = "claude:haiku@xhigh"
"how explainer" = "claude:opus@medium"
"why investigators, synthesizer" = "inherit-parent"
"reflect tooling, judgment, divergent, synthesizer" = "inherit-parent"
"arena runners" = ["claude:opus@high", "codex:sol@high", "cursor:grok-4.7@high", "agy:gemini-4-argon@high"]
"arena cross-judge pool" = ["codex:astra@xhigh", "claude:opus@xhigh"]
"swarm workers" = "claude:opus@medium"
"architect runners" = ["claude:opus@high", "claude:opus@medium"]
"interrogate reviewers" = ["claude:opus@xhigh", "codex:astra@xhigh"]

[sheet.codex]
"feature, refactoring" = "codex:sol@medium"
"bug-fix" = "codex:sol@medium"
"perf-issue" = "codex:sol@medium"
"hillclimb" = "codex:sol@medium"
"judgment and prose" = "codex:astra@xhigh"
"hardest tasks" = "codex:astra@xhigh"
"how explorer" = "codex:terra@xhigh"
"how explainer" = "codex:sol@medium"
"why investigators, synthesizer" = "inherit-parent"
"reflect tooling, judgment, divergent, synthesizer" = "inherit-parent"
"arena runners" = ["codex:sol@high", "claude:opus@high", "cursor:grok-4.7@high", "agy:gemini-4-argon@high"]
"arena cross-judge pool" = ["claude:opus@xhigh", "codex:astra@xhigh"]
"swarm workers" = "codex:sol@medium"
"architect runners" = ["codex:astra@xhigh", "codex:sol@medium"]
"interrogate reviewers" = ["codex:astra@xhigh", "claude:opus@xhigh"]

# What `ai-stack install --clean` and `ai-stack diff --clean` keep. Clean is off
# unless one of those flags is passed or it is toggled in the review screen.
# Every entry in a skill root that no keep_skills glob matches is moved into the
# run's backup directory; nothing is deleted. Entries starting with `.` and the
# app-managed `synced` directory are always kept. Every installed plugin whose
# `name@marketplace` no keep_plugins glob matches is uninstalled. Globs use `*`
# and `?`.
[clean]
skill_roots = ["~/.claude/skills", "~/.codex/skills", "~/.agents/skills"]
keep_skills = [
  "better-*", "brandkit", "break", "variant", "explain-interface",
  "interface-review", "design-taste-frontend", "gpt-taste",
  "high-end-visual-design", "image-to-code", "oklch-skill", "color-expert",
  "minimalist-ui", "cua-*", "gui-automation", "hatch-pet", "turborepo",
  "computer-use-linux",
]
# Codex's built-in plugins come from `openai-*` marketplaces. Clean never
# touches a `jm` plugin: install owns that marketplace.
keep_plugins = [
  "github@claude-plugins-official",
  "chrome-devtools-mcp@claude-plugins-official", "*@openai-*",
]

# `ai-stack skills add` and `skills update` run a vendored skill's
# `type = "prompt"` process steps with this argv, the prompt appended as the
# last argument, in the staged skill directory. No shell is involved. The agent
# edits files there by design, so pick a permission mode you trust.
[skills]
prompt_runner = ["claude", "-p", "--permission-mode", "acceptEdits"]

# Both harnesses submit to this private file through `ai-stack incident record`.
# The worker classifies duplicates without project context; agents never read it.
# Relative paths resolve from the user home.
[incidents]
path = "~/.local/state/ai-stack/incidents.md"
worker = "haiku"

# `ai-stack lint` and the agent hooks that `ai-stack install` registers check
# only changed lines. An agent's `git commit`, run by Claude Code or Codex,
# removes the whole-line comments that the agent's own edits wrote and
# no-comments reports, keeps every other comment, and refuses a commit when an
# error from a rule it cannot fix is left. Repositories under a temp dir, or
# other repositories in an ignored path, are left alone; worktrees are checked.
# In a jj workspace the same comments are removed with `jj fix` after an
# agent's `jj commit`, `describe`, `new`, `squash` or `split`, and a
# `jj git push` is refused while such an error is left.
# Every key is optional; uncomment to change a default. `enabled = false` turns
# every hook call into a silent no-op, and install then removes the lint
# environment it wrote. `severity` values are "error", "warning" or "off".
# Globs match paths relative to the repository root.
# `skip` bounds what one AI_STACK_LINT_SKIP="<reason>" commit may hold; a jj
# push skip uses only `files` and `findings`.
# `skip_alert` notifies you when skips and --no-verify bypasses (commits with
# errors the hook would refuse or agent prose it would remove) reach
# `percent` of a repository's agent commits over `days`, once it has at
# least `min_commits` commits.
# [lint]
# enabled = true
# scope = "lines"                 # lines | function | file
# disable = []
# enable = ["no-explicit-return-types"]
# severity = { "no-lint-suppression" = "warning" }
# ignore = ["**/vendor/**", "**/node_modules/**"]
# skip = { files = 1, hunks = 1, lines = 20, findings = 3 }
# skip_alert = { percent = 20, days = 7, min_commits = 5 }
#
# A project is its main checkout, so these settings also cover its worktrees.
# `paths` limits a rule to the listed globs in that project.
# [[lint.project]]
# path = "~/Documents/Projects/@joshmeads/ai-stack"
# paths = { "no-comments" = ["cli/**", "skills/devtools-perf/**"] }
# ignore = ["plugins/t3stack/**"]
# scope = "lines"
# enabled = true
